name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required knowledge files exist
        run: |
          set -e
          test -f AGENTS.md
          test -f docs/MISSION.md
          test -f docs/DECISIONS.md
          test -f docs/STATUS.md
          test -f docs/SLICE_0.md
          test -f docs/REVIEW.md
          test -f docs/IDEAS.md
          test -f docs/BUGS.md
          test -f docs/research/biomes/_template.md
          test -f docs/research/biomes/coastal_north.md
          test -f docs/research/biomes/river_valley.md
          test -f docs/research/biomes/inland_plains.md
          test -f docs/research/biomes/bayou.md
          test -f .cursor/rules/knowledge.mdc
          test -f .cursor/rules/dev-loop.mdc
          test -f .cursor/rules/commit-signoff.mdc
          test -f .cursor/skills/playtest-pr/SKILL.md
          test -f .cursor/hooks.json
          test -f .cursor/hooks/session-start.js
          test -f .cursor/mcp.json
          test -f docs/PIXELAB.md
          test -f game/project.godot

  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          set -e
          curl -L -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import project
        run: godot --headless --path game --import --quit
      - name: Headless tests
        run: godot --headless --path game -s res://tests/run.gd
